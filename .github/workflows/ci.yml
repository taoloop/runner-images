name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: pipx run ruff==0.16.8 check . && pipx run ruff==0.16.8 format --check .
      - run: for f in Codex Harness MinerServer; do docker build -f "$f.Dockerfile" -t "check-$(echo "$f" | tr A-Z a-z)" .; done
